services:
  - type: web
    name: waimao-workbench
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22.22.2"
      - key: PASSWORD
        value: "siyueyue"
      - key: GITHUB_TOKEN
        sync: false
      - key: GIST_ID
        sync: false
