<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>外贸跟单工作台</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#f472b6;--primary-light:#fdf2f8;--success:#5ebd8b;--success-light:#edfaf3;
  --warning:#f59e0b;--warning-light:#fff8eb;--danger:#f87171;--danger-light:#fef2f2;
  --gray-50:#fdf2f8;--gray-100:#fce7f3;--gray-200:#fbcfe8;--gray-300:#f9a8d4;
  --gray-400:#c4b5bd;--gray-500:#9d8d95;--gray-600:#756b70;--gray-700:#554c50;
  --gray-800:#383336;--gray-900:#211d1f;
  --radius:14px;--radius-sm:10px;--shadow:0 2px 8px rgba(244,114,182,.08),0 1px 3px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(244,114,182,.1),0 2px 6px rgba(0,0,0,.04);
  --shadow-lg:0 12px 24px rgba(244,114,182,.12),0 6px 12px rgba(0,0,0,.06);
  --transition:.25s ease;
  --primary-dark:#be185d;
  --text-muted:#8a6a86;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC",sans-serif;
  background:linear-gradient(135deg,#fdf2f8 0%,#fff5f9 30%,#fef8fb 60%,#fff 100%);color:var(--gray-800);line-height:1.6;height:100vh;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.header{
  background:linear-gradient(90deg,#fdf2f8 0%,#fff 55%);border-bottom:1px solid #fbcfe8;padding:12px 20px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
  position:sticky;top:0;z-index:100;box-shadow:0 1px 8px rgba(244,114,182,.08);
}
.header-left{display:flex;align-items:center;gap:10px}
.header-logo{height:68px;width:auto;display:block;border-radius:0;filter:drop-shadow(0 4px 14px rgba(244,114,182,.12));flex-shrink:0}
.header-title{font-size:18px;font-weight:700;color:var(--gray-900)}
.header-sub{font-size:12px;color:var(--gray-500);margin-left:4px}
  .header-actions{display:flex;gap:6px;flex-wrap:wrap}
  .header-tabs{display:flex;gap:2px;align-items:center}
.btn{
  display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:var(--radius-sm);
  font-size:13px;font-weight:500;cursor:pointer;transition:var(--transition);
  border:1px solid transparent;white-space:nowrap;min-height:36px;
  font-family:inherit;
}
.btn svg{width:15px;height:15px;flex-shrink:0}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:#ec4899;border-color:#ec4899;box-shadow:0 4px 12px rgba(244,114,182,.35)}
.btn-outline{background:#fff;color:var(--gray-700);border-color:var(--gray-200)}
.btn-outline:hover{background:var(--primary-light);border-color:var(--primary)}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{background:#4aa878;box-shadow:0 4px 12px rgba(94,189,139,.3)}
.btn-danger{background:#fff;color:var(--danger);border-color:#fca5a5}
.btn-danger:hover{background:var(--danger-light);border-color:var(--danger);box-shadow:0 4px 12px rgba(248,113,113,.25)}
.btn-sm{padding:4px 10px;font-size:12px;min-height:30px}
.btn-xs{padding:2px 8px;font-size:11px;min-height:26px;border-radius:4px}
.btn-icon{padding:6px;min-width:36px;justify-content:center}

.alert-strip{
  margin:0;padding:10px 20px;display:flex;align-items:center;gap:8px;
  font-size:13px;cursor:pointer;transition:var(--transition);
  border-bottom:1px solid transparent;
}
.alert-strip.has-urgent{background:var(--danger-light);border-color:#fecaca;color:var(--danger)}
.alert-strip.has-today{background:var(--warning-light);border-color:#fde68a;color:#b45309}
.alert-strip.clean{background:#ecfdf5;border-color:#a7f3d0;color:#047857}
.alert-strip svg{width:18px;height:18px;flex-shrink:0}
.alert-badge{
  display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;
  border-radius:11px;font-size:11px;font-weight:700;padding:0 7px;
}
.alert-badge.danger{background:var(--danger);color:#fff}
.alert-badge.warning{background:var(--warning);color:#fff}

.layout{display:flex;height:calc(100vh - 137px);overflow:hidden}
.sidebar{
  width:320px;min-width:320px;background:#fff;border-right:1px solid #fbcfe8;
  display:flex;flex-direction:column;overflow:hidden;
}
.sidebar-header{
  padding:14px 16px;border-bottom:1px solid #fbcfe8;
  display:flex;align-items:center;justify-content:space-between;
}
.sidebar-title{font-size:14px;font-weight:600;color:var(--gray-800)}
.sidebar-count{font-size:12px;color:var(--gray-400)}
.order-list{flex:1;overflow-y:auto;padding:8px 8px 72px}
.order-item{
  padding:7px 10px;border-radius:var(--radius);cursor:pointer;
  transition:var(--transition);margin-bottom:0;position:relative;
  border:2px solid transparent;
  display:flex;align-items:flex-start;gap:7px;
}
.order-item:hover{background:var(--primary-light)}
.order-item.active{background:var(--primary-light);border-color:var(--primary)}
.order-item + .order-item{margin-top:11px;padding-top:11px}
.order-item + .order-item::before{content:"";position:absolute;top:-6px;left:0;right:0;height:1px;background:#eef2f7}
.drag-handle{
  flex:0 0 auto;width:14px;align-self:stretch;display:flex;align-items:center;justify-content:center;
  color:#ec9ec9;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
}
.drag-handle:active{cursor:grabbing}
.drag-handle svg{width:13px;height:13px;display:block}
.order-item-main{flex:1;min-width:0}
.o-line1{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;line-height:1.35}
.o-line2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:5px;line-height:1.3}
.order-item-no{font-size:14px;font-weight:600;color:var(--gray-800)}
.order-item-client{font-size:12.5px;color:var(--gray-600);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.order-item-product{font-size:12px;color:var(--gray-500);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.order-item-ship{font-size:12px;color:#db2777;display:flex;align-items:center;gap:3px;flex:0 0 auto}
.order-item-ship svg{width:11px;height:11px;flex:0 0 auto}
.order-item-stage{
  font-size:11px;flex:0 0 auto;display:inline-flex;align-items:center;gap:3px;
  padding:2px 8px;border-radius:9px;font-weight:600;white-space:nowrap;
}
.order-item-actions{display:flex;gap:4px;margin-top:6px}
.order-item-placeholder{background:#fce7f3;border:2px dashed #f9a8d4;border-radius:var(--radius);margin-bottom:0;box-sizing:border-box}
.drag-ghost{position:fixed;z-index:9999;pointer-events:none;background:#fff;border:2px solid var(--primary);border-radius:var(--radius);box-shadow:0 10px 28px rgba(236,72,153,.25);padding:7px 10px;box-sizing:border-box;opacity:.97}
/* search box */
.sidebar-search{position:relative;padding:8px 12px;border-bottom:1px solid #fbcfe8;background:#fff}
.sidebar-search svg{position:absolute;left:22px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:#ec4899;opacity:.55;pointer-events:none}
.sidebar-search input{
  width:100%;box-sizing:border-box;border:1px solid #fbcfe8;border-radius:9px;
  padding:7px 10px 7px 30px;font-size:13px;background:#fdf2f8;color:var(--gray-800);outline:none;
}
.sidebar-search input:focus{border-color:var(--primary);background:#fff}
.sidebar-search input::placeholder{color:#d6a5c4}
.sidebar-footer{position:fixed;left:0;bottom:0;width:320px;border-top:2px solid #fbcfe8;background:linear-gradient(180deg,#fff 0%,#fdf2f8 100%);padding:12px;z-index:10}
.sidebar-footer .btn{min-height:42px;font-size:14px}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.main-scroll{flex:1;overflow-y:auto;padding:20px}
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;color:var(--gray-400);text-align:center;gap:12px;
}
.empty-state svg{width:60px;height:60px;opacity:.4}
.empty-state p{font-size:14px}

.order-detail-header{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;
  gap:12px;margin-bottom:20px;
}
.order-meta{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.order-no-display{font-size:20px;font-weight:700;color:var(--gray-900)}
.order-client-display{font-size:14px;color:var(--gray-600)}
.order-product{font-size:13px;color:var(--gray-500)}
.order-ship-meta{font-size:13px;color:#db2777}
.stage-badge{
  display:inline-flex;align-items:center;gap:5px;padding:4px 12px;
  border-radius:14px;font-size:12px;font-weight:600;
}

.stage-timeline{display:flex;gap:0;margin-bottom:24px;overflow-x:auto;padding:4px 0}
.stage-step{
  flex:1;min-width:70px;text-align:center;position:relative;cursor:pointer;
  padding:0 2px;
}
.stage-step-dot{
  width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;transition:var(--transition);position:relative;z-index:1;
}
.stage-step-line{
  position:absolute;top:19px;height:3px;z-index:0;
}
.stage-step:first-child .stage-step-line{left:50%;right:0}
.stage-step:last-child .stage-step-line{left:0;right:50%}
.stage-step:not(:first-child):not(:last-child) .stage-step-line{left:0;right:0}
.stage-step-label{font-size:13px;color:var(--gray-600);margin-top:6px;line-height:1.3;font-weight:500}
.stage-step.active .stage-step-label{color:var(--primary);font-weight:600}
.stage-step.past .stage-step-dot{background:var(--success);color:#fff}
.stage-step.active .stage-step-dot{background:var(--primary);color:#fff;box-shadow:0 0 0 4px var(--primary-light)}
.stage-step.future .stage-step-dot{background:#fce7f3;color:#f472b6}
.stage-step.past .stage-step-line{background:var(--success)}
.stage-step.active .stage-step-line{background:var(--primary)}
.stage-step.future .stage-step-line{background:#fce7f3}

.section-title{
  font-size:15px;font-weight:600;color:var(--gray-800);margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-bottom:20px}
.doc-card{
  background:#fff;border-radius:var(--radius);padding:14px 16px;
  box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;
  transition:var(--transition);border-left:3px solid var(--gray-300);
}
.doc-card.essential{border-left-color:var(--primary)}
.doc-card.ready{border-left-color:var(--success);background:var(--success-light)}
.doc-card.skipped{opacity:.5}
.doc-card-name{font-size:14px;font-weight:500;color:var(--gray-800)}
.doc-card-tag{
  font-size:11px;padding:2px 6px;border-radius:4px;font-weight:500;
}
.doc-card-tag.ready-tag{background:var(--success);color:#fff}
.doc-card-tag.pending-tag{background:var(--warning);color:#fff}
.doc-card-tag.skip-tag{background:var(--gray-300);color:var(--gray-600)}
.doc-card-actions{display:flex;gap:4px}

.overdue-doc{background:var(--danger-light);border-left-color:var(--danger)!important}
.overdue-doc .doc-card-name{color:var(--danger)}
.overdue-badge{
  display:inline-flex;align-items:center;gap:2px;font-size:10px;padding:1px 6px;
  border-radius:8px;background:var(--danger);color:#fff;font-weight:600;margin-left:6px;
}

.notes-area{margin-top:20px;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.notes-header{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;cursor:pointer;user-select:none;transition:var(--transition)}
.notes-header:hover{background:var(--primary-light)}
.notes-label{font-size:13px;font-weight:600;color:var(--gray-600);margin-bottom:0;display:flex;align-items:center;gap:7px}
.notes-badge{font-size:11px;font-weight:600;color:var(--primary);background:var(--primary-light);border-radius:10px;padding:1px 8px;letter-spacing:.5px}
.notes-arrow{width:18px;height:18px;flex-shrink:0;color:var(--gray-400);transition:transform .25s ease}
.notes-area.collapsed .notes-arrow{transform:rotate(-90deg)}
.notes-body{display:block;padding:0 16px 16px}
.notes-area.collapsed .notes-body{display:none}
.notes-area textarea{
  width:100%;min-height:80px;border:1px solid #fbcfe8;border-radius:var(--radius-sm);
  padding:10px 12px;font-size:14px;font-family:inherit;resize:vertical;box-sizing:border-box;
  color:var(--gray-800);transition:var(--transition);
}
.notes-area textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}

.modal-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);
  z-index:200;display:flex;align-items:center;justify-content:center;
}
.modal{
  background:#fff;border-radius:var(--radius);padding:24px;width:90%;max-width:440px;
  max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-lg);
}
.modal h3{font-size:17px;font-weight:700;margin-bottom:16px;color:var(--gray-900)}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:4px}
.form-group input,.form-group select{
  width:100%;  padding:9px 12px;border:1px solid #fbcfe8;border-radius:var(--radius-sm);
  font-size:14px;font-family:inherit;color:var(--gray-800);transition:var(--transition);
}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

.stage-select-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.stage-pill{
  padding:6px 14px;border-radius:16px;font-size:12px;font-weight:500;
  cursor:pointer;border:1px solid #fbcfe8;background:#fff;color:var(--gray-700);
  transition:var(--transition);
}
.stage-pill:hover{border-color:var(--primary);color:var(--primary)}
.stage-pill.selected{background:var(--primary);color:#fff;border-color:var(--primary)}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:300;
  background:var(--gray-700);color:#fff;padding:10px 20px;border-radius:20px;
  font-size:13px;box-shadow:0 4px 16px rgba(244,114,182,.25);animation:toastIn .3s ease;
}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

.confirm-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:250;display:flex;align-items:center;justify-content:center}
.confirm-box{
  background:#fff;border-radius:var(--radius);padding:24px;width:90%;max-width:380px;text-align:center;
}
.confirm-box p{font-size:14px;color:var(--gray-700);margin:12px 0 20px}
.confirm-box .btn-group{display:flex;gap:8px;justify-content:center}

@media(max-width:768px){
  .layout{flex-direction:column;height:auto}
  .sidebar{width:100%;min-width:unset;max-height:180px;border-right:none;border-bottom:1px solid #fbcfe8}
  .main-scroll{padding:12px}
  .order-detail-header{flex-direction:column;align-items:flex-start}
  .doc-grid{grid-template-columns:1fr}
  .stage-timeline{gap:0;}
  .stage-step{min-width:56px}
  .stage-step-label{font-size:10px}
  .header{padding:8px 12px}
  .header-title{font-size:15px}
  .header-logo{height:44px}
  .btn{font-size:11px;padding:5px 10px;min-height:32px}
  .btn svg{width:13px;height:13px}
  .alert-strip{padding:8px 12px;font-size:12px}
  .modal{padding:16px;width:95%}
  .header-tabs{order:3;width:100%;justify-content:center;border-top:1px dashed #fbcfe8;padding-top:8px;margin-top:2px}
}
@media(max-width:480px){
  .stage-step{min-width:48px}
  .stage-step-label{font-size:9px}
  .stage-step-dot{width:26px;height:26px;font-size:12px}
  .stage-step-line{top:13px;height:2px}
  .order-no-display{font-size:16px}
  .header-actions{gap:3px}
  .btn{padding:4px 8px;font-size:10px;min-height:28px}
}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#f9a8d4;border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:#f472b6}
.order-list::-webkit-scrollbar{width:4px}
.order-list::-webkit-scrollbar-thumb{background:#fbcfe8}
.order-list::-webkit-scrollbar-thumb:hover{background:#f9a8d4}
.main-scroll::-webkit-scrollbar{width:7px}
.main-scroll::-webkit-scrollbar-thumb{background:#f472b6}
.main-scroll::-webkit-scrollbar-thumb:hover{background:#ec4899}

/* Login overlay */
.login-overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;
  background:linear-gradient(135deg,#fdf2f8 0%,#fff5f9 30%,#fef8fb 60%,#fff 100%);
  display:flex;align-items:center;justify-content:center;
}
.login-overlay.hidden{display:none}
.login-card{
  background:#fff;border-radius:20px;padding:40px 36px;width:360px;max-width:92vw;
  box-shadow:0 8px 30px rgba(244,114,182,.15),0 2px 8px rgba(0,0,0,.05);
  text-align:center;
}
.login-logo-svg{width:56px;height:56px;margin:0 auto 16px}
.login-title{font-size:22px;font-weight:700;color:#383336;margin-bottom:4px}
.login-sub{font-size:13px;color:#9d8d95;margin-bottom:28px}
.login-input{
  width:100%;padding:12px 16px;border:2px solid #fbcfe8;border-radius:14px;
  font-size:16px;font-family:inherit;color:#383336;outline:none;transition:border-color .25s ease,box-shadow .25s ease;
}
.login-input:focus{border-color:#f472b6;box-shadow:0 0 0 4px rgba(244,114,182,.15)}
.login-btn{
  width:100%;padding:12px;margin-top:16px;background:#f472b6;color:#fff;
  border:none;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;transition:all .25s ease;
}
.login-btn:hover{background:#ec4899;box-shadow:0 4px 14px rgba(244,114,182,.3)}
.login-error{margin-top:12px;font-size:13px;color:#f87171;min-height:20px}
.login-footer{margin-top:24px;font-size:11px;color:#c4b5bd}
.login-shake{animation:lshake .4s ease}
@keyframes lshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
/* ===== 工作台 / 看板 Tab ===== */
.tab-btn{
  display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border:none;background:none;
  font-size:13px;font-weight:600;color:var(--gray-500);cursor:pointer;
  border-bottom:3px solid transparent;transition:var(--transition);font-family:inherit;
}
.tab-btn:hover{color:var(--primary)}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab-btn svg{width:15px;height:15px}

/* ===== 看板 ===== */
.dashboard-wrap{max-width:1000px;margin:0 auto;padding:18px 16px 28px;height:calc(100vh - 137px);overflow-y:auto}
.tip{
  display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#fce7f3,#fff);
  border:1.5px dashed var(--gray-300);border-radius:16px;padding:10px 15px;margin-bottom:14px;
  font-size:12.5px;color:var(--primary-dark);font-weight:600;
}
.last-update{font-size:11.5px;color:var(--text-muted);font-weight:600;margin-bottom:12px;display:block}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.card{
  background:#fff;border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);
  border:1.5px solid var(--gray-200);display:flex;flex-direction:column;
}
.card-title{font-size:14px;font-weight:800;color:var(--gray-800);margin-bottom:14px;display:flex;align-items:center;gap:7px}
.card-title .ttl-ic{flex-shrink:0}
.card-hint{font-size:11px;color:var(--text-muted);font-weight:600;margin-left:auto}
.pie-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;flex:1}
.pie-box{position:relative;width:180px;height:180px;flex-shrink:0}
.pie-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.pie-center .big{font-size:32px;font-weight:800;color:var(--gray-900);line-height:1}
.pie-center .small{font-size:11.5px;color:var(--text-muted);font-weight:700;margin-top:3px}
.slice{cursor:pointer;transition:opacity .15s ease,filter .15s ease;transform-origin:center}
.slice:hover{opacity:.9;filter:brightness(1.04)}
.slice.sel{filter:drop-shadow(0 4px 8px rgba(244,114,182,.55))}
.legend{display:flex;flex-direction:column;gap:6px;flex:1;min-width:140px}
.legend-item{display:flex;align-items:center;gap:8px;font-size:13px;padding:7px 10px;border-radius:11px;cursor:pointer;transition:var(--transition);border:1.5px solid transparent}
.legend-item:hover{background:var(--gray-50)}
.legend-item.active{background:var(--primary-light);border-color:var(--gray-300)}
.legend-item .sw{width:13px;height:13px;border-radius:5px;flex-shrink:0}
.legend-item .nm{color:var(--gray-700);font-weight:700}
.legend-item .val{margin-left:auto;font-weight:800;color:var(--gray-900);background:var(--gray-50);border-radius:20px;padding:1px 9px;font-size:12px}
.legend-item.active .val{background:#fff;color:var(--primary-dark)}
.legend-item .zero{opacity:.4}
.drill-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.drill-head .title{font-size:15px;font-weight:800;color:var(--gray-900);display:flex;align-items:center;gap:8px}
.drill-head .title .cnt{font-size:13px;color:#fff;background:var(--primary);border-radius:20px;padding:2px 11px;font-weight:700}
.drill-close{border:none;background:var(--gray-50);color:var(--gray-700);width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--transition)}
.drill-close:hover{background:var(--danger);color:#fff}
.drill-list{display:flex;flex-direction:column;gap:9px}
.drill-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius-sm);background:var(--gray-50);border:1.5px solid var(--gray-200);transition:var(--transition)}
.drill-row:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.drill-no{font-weight:800;font-size:14px;color:var(--primary-dark);text-decoration:none;min-width:100px;flex-shrink:0;transition:var(--transition);display:flex;align-items:center;gap:6px}
.drill-no .dot{width:7px;height:7px;border-radius:50%;background:var(--primary);flex-shrink:0}
.drill-no:hover{text-decoration:underline;color:var(--primary)}
.drill-info{flex:1;min-width:0}
.drill-client{font-size:13px;color:var(--gray-700);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drill-product{font-size:11.5px;color:var(--text-muted);font-weight:600}
.drill-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
.drill-htag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;color:#fff;white-space:nowrap}
@media(max-width:768px){
  .dashboard-wrap{height:auto;overflow:visible}
  .grid-2{grid-template-columns:1fr}
  .pie-wrap{gap:12px}
}
</style>
</head>

<script>
// ==================== PASSWORD AUTH ====================
function checkPassword(){
  var input = document.getElementById('loginPwd');
  var error = document.getElementById('loginError');
  var overlay = document.getElementById('loginOverlay');
  var pwd = input.value.trim();

  if(!pwd){
    error.textContent = '请输入密码';
    overlay.querySelector('.login-card').classList.add('login-shake');
    setTimeout(function(){ overlay.querySelector('.login-card').classList.remove('login-shake'); }, 400);
    return;
  }
  fetch('/api/login', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: pwd })
  }).then(function(r){
    return r.json().then(function(d){ return { ok: r.ok, d: d }; });
  }).then(function(res){
    if(res.ok && res.d && res.d.success){
      overlay.classList.add('hidden');
      if(!window._appInited){ window._appInited = true; init(); }
    } else {
      error.textContent = (res.d && res.d.message) ? res.d.message : '密码错误，请重试';
      overlay.querySelector('.login-card').classList.add('login-shake');
      setTimeout(function(){ overlay.querySelector('.login-card').classList.remove('login-shake'); }, 400);
      input.value = '';
      input.focus();
    }
  }).catch(function(){
    error.textContent = '登录请求失败，请稍后重试';
  });
}

function doLogout(){
  document.getElementById('confirmMsg').textContent = '确认退出登录？';
  document.getElementById('confirmOkBtn').onclick = function(){
    fetch('/api/logout', { method:'POST' }).catch(function(){}).finally(function(){
      location.reload();
    });
    closeConfirm();
  };
  document.getElementById('confirmDialog').style.display = 'flex';
}

// Enter key to login
document.getElementById('loginPwd').addEventListener('keydown', function(e){
  if(e.key === 'Enter') checkPassword();
});

// ==================== INIT ====================
function init(){
  loadRemote(function(){
    if(!orders || orders.length === 0){
      orders = getExampleOrders();
      saveData();
    }
    if(currentView === 'active' && orders.length > 0 && !selectedOrderId){
      selectedOrderId = orders[0].id;
    }
    if(currentView === 'archive' && archiveOrders.length > 0 && !selectedOrderId){
      selectedOrderId = archiveOrders[0].id;
    }
    renderAll();
    applyDeepLink();
    defaultDrill();
  });

function normalizeOrders(list){
  if(!Array.isArray(list)) return;
  for(var i=0;i<list.length;i++){
    if(!list[i].docStatus) list[i].docStatus = {};
  }
}

// Load from server (Gist-backed); fall back to localStorage cache if offline
function loadRemote(cb){
  if(location.protocol === 'file:'){
    try{ var s = localStorage.getItem(STORAGE_KEY); if(s) orders = JSON.parse(s); }catch(e){ orders = orders || []; }
    try{ var sa = localStorage.getItem(ARCHIVE_KEY); if(sa) archiveOrders = JSON.parse(sa); }catch(e){ archiveOrders = archiveOrders || []; }
    normalizeOrders(orders);
    normalizeOrders(archiveOrders);
    cb();
    return;
  }
  fetch('/api/data').then(function(r){ return r.json(); }).then(function(data){
    orders = Array.isArray(data.orders) ? data.orders : [];
    archiveOrders = Array.isArray(data.archiveOrders) ? data.archiveOrders : [];
    normalizeOrders(orders);
    normalizeOrders(archiveOrders);
    cacheLocal();
    cb();
  }).catch(function(){
    try{ var s = localStorage.getItem(STORAGE_KEY); if(s) orders = JSON.parse(s); }catch(e){ orders = orders || []; }
    try{ var sa = localStorage.getItem(ARCHIVE_KEY); if(sa) archiveOrders = JSON.parse(sa); }catch(e){ archiveOrders = archiveOrders || []; }
    normalizeOrders(orders);
    normalizeOrders(archiveOrders);
    cb();
  });
}

// 看板点击订单号跳转到此：waimao-workbench.html#order=ID
function applyDeepLink(){
  var h = location.hash || '';
  if(h.indexOf('#order=') !== 0) return;
  var id = decodeURIComponent(h.slice(7));
  if(!id) return;
  var found = false;
  for(var i=0;i<orders.length;i++){
    if(orders[i].id === id){ currentView='active'; selectedOrderId=id; found=true; break; }
  }
  if(!found){
    for(var j=0;j<archiveOrders.length;j++){
      if(archiveOrders[j].id === id){ currentView='archive'; selectedOrderId=id; found=true; break; }
    }
  }
  if(found){
    renderAll();
    if(history.replaceState){ history.replaceState(null, '', location.pathname + location.search); }
  }
}

function saveData(){
  cacheLocal();
  if(location.protocol === 'file:') return; // 本地预览：仅用 localStorage，不发网络请求
  fetch('/api/data', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ orders: orders, archiveOrders: archiveOrders })
  }).catch(function(){
    showToast('云端保存失败，已保留本地缓存');
  });
}

function cacheLocal(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(orders));
    localStorage.setItem(ARCHIVE_KEY, JSON.stringify(archiveOrders));
  }catch(e){}
}

// ==================== ALERT STRIP ====================
function getTodoItems(){
  var today = dateStr(Date.now());
  var urgent = [];
  var normal = [];
  var activeOrders = (currentView === 'archive') ? [] : orders;

  for(var oi=0; oi<activeOrders.length; oi++){
    var order = activeOrders[oi];
    var stageIdx = -1;
    for(var si=0; si<STAGES.length; si++){
      if(STAGES[si].id === order.currentStage){stageIdx=si;break;}
    }
    if(stageIdx < 0) continue;

    var currentStage = STAGES[stageIdx];
    for(var di=0; di<currentStage.docs.length; di++){
      var doc = currentStage.docs[di];
      var statusKey = order.currentStage + '_' + doc.key;
      var status = order.docStatus[statusKey] || 'pending';
      if(status === 'pending'){
        var item = {
          orderId:order.id, orderNo:order.orderNo, client:order.client,
          stageId:order.currentStage, stageName:currentStage.name,
          docName:doc.name, docKey:doc.key, essential:doc.essential, type:'current'
        };
        if(order.shipDate){
          var daysUntilShip = Math.ceil((new Date(order.shipDate) - new Date(today)) / 86400000);
          // 当前节点在办单证：仅船期临近（0~3天）才算紧急；船期已过则视为"推进中"，不算逾期
          if(daysUntilShip >= 0 && daysUntilShip <= 3) urgent.push({urgent:true,days:daysUntilShip,item:item});
          else normal.push(item);
        } else {
          normal.push(item);
        }
      }
    }

    for(var pi=0; pi<stageIdx; pi++){
      var prevStage = STAGES[pi];
      for(var pdi=0; pdi<prevStage.docs.length; pdi++){
        var pdoc = prevStage.docs[pdi];
        var psk = prevStage.id + '_' + pdoc.key;
        var pst = order.docStatus[psk] || 'pending';
        if(pst === 'pending'){
          urgent.push({urgent:true,overdue:true,item:{
            orderId:order.id, orderNo:order.orderNo, client:order.client,
            stageId:prevStage.id, stageName:prevStage.name,
            docName:pdoc.name, docKey:pdoc.key, essential:pdoc.essential,
            type:'overdue'
          }});
        }
      }
    }
  }

  return {urgent:urgent, normal:normal};
}

// 真正"卡住"的判定：当前节点之前的节点还有未完成单证，才算真正逾期
function orderOverdueCount(order){
  var stageIdx = -1;
  for(var si=0; si<STAGES.length; si++){ if(STAGES[si].id === order.currentStage){ stageIdx=si; break; } }
  if(stageIdx < 0) return 0;
  var cnt = 0;
  for(var pi=0; pi<stageIdx; pi++){
    var ps = STAGES[pi];
    for(var pdi=0; pdi<ps.docs.length; pdi++){
      var psk = ps.id + '_' + ps.docs[pdi].key;
      if((order.docStatus[psk]||'pending') === 'pending') cnt++;
    }
  }
  return cnt;
}

// ==================== DRAG TO REORDER (pointer events: mouse + touch) ====================
var dragCtx = null;
var suppressClick = false;

function initOrderDrag(){
  var list = document.getElementById('orderList');
  if(list) list.addEventListener('pointerdown', onDragPointerDown);
}

function onDragPointerDown(e){
  if(currentView === 'archive') return;
  var handle = e.target.closest('.drag-handle');
  if(!handle) return;
  var item = handle.closest('.order-item');
  if(!item) return;
  var rect = item.getBoundingClientRect();
  dragCtx = {
    id: item.getAttribute('data-id'),
    el: item,
    startX: e.clientX, startY: e.clientY,
    offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top,
    width: rect.width, height: rect.height,
    started: false, ghost: null, placeholder: null
  };
  window.addEventListener('pointermove', onDragPointerMove);
  window.addEventListener('pointerup', onDragPointerUp);
  window.addEventListener('pointercancel', onDragPointerUp);
}

function onDragPointerMove(e){
  if(!dragCtx) return;
  if(!dragCtx.started){
    if(Math.abs(e.clientX - dragCtx.startX) < 5 && Math.abs(e.clientY - dragCtx.startY) < 5) return;
    dragCtx.started = true;
    var el = dragCtx.el;
    var ph = document.createElement('div');
    ph.className = 'order-item-placeholder';
    ph.style.height = dragCtx.height + 'px';
    el.parentNode.insertBefore(ph, el);
    dragCtx.placeholder = ph;
    var ghost = el.cloneNode(true);
    ghost.className = 'order-item drag-ghost';
    ghost.style.width = dragCtx.width + 'px';
    ghost.style.height = dragCtx.height + 'px';
    document.body.appendChild(ghost);
    dragCtx.ghost = ghost;
    el.style.display = 'none';
    document.body.style.cursor = 'grabbing';
  }
  dragCtx.ghost.style.left = (e.clientX - dragCtx.offsetX) + 'px';
  dragCtx.ghost.style.top = (e.clientY - dragCtx.offsetY) + 'px';
  var ph = dragCtx.placeholder;
  var siblings = getDragSiblings();
  var inserted = false;
  for(var i=0;i<siblings.length;i++){
    var r = siblings[i].getBoundingClientRect();
    if(e.clientY < r.top + r.height/2){ ph.parentNode.insertBefore(ph, siblings[i]); inserted = true; break; }
  }
  if(!inserted) ph.parentNode.appendChild(ph);
}

function getDragSiblings(){
  var list = document.getElementById('orderList');
  var nodes = list.querySelectorAll('.order-item');
  var arr = [];
  for(var i=0;i<nodes.length;i++){ if(nodes[i] !== dragCtx.el) arr.push(nodes[i]); }
  return arr;
}

function onDragPointerUp(){
  window.removeEventListener('pointermove', onDragPointerMove);
  window.removeEventListener('pointerup', onDragPointerUp);
  window.removeEventListener('pointercancel', onDragPointerUp);
  var ctx = dragCtx; dragCtx = null;
  if(!ctx) return;
  if(!ctx.started) return;
  suppressClick = true;
  setTimeout(function(){ suppressClick = false; }, 60);
  var list = document.getElementById('orderList');
  var ph = ctx.placeholder;
  var placeholderIndex = 0;
  for(var k=0;k<list.children.length;k++){
    var c = list.children[k];
    if(c === ph) break;
    if(c.classList.contains('order-item') && c !== ctx.el) placeholderIndex++;
  }
  var map = {};
  for(var m=0;m<orders.length;m++) map[orders[m].id] = orders[m];
  var newOrders = [];
  var items = list.querySelectorAll('.order-item');
  for(var i=0;i<items.length;i++){
    var id = items[i].getAttribute('data-id');
    if(id === ctx.id) continue;
    if(map[id]) newOrders.push(map[id]);
  }
  newOrders.splice(placeholderIndex, 0, map[ctx.id]);
  orders = newOrders;
  if(ctx.ghost && ctx.ghost.parentNode) ctx.ghost.parentNode.removeChild(ctx.ghost);
  if(ctx.placeholder && ctx.placeholder.parentNode) ctx.placeholder.parentNode.removeChild(ctx.placeholder);
  document.body.style.cursor = '';
  ctx.el.style.display = '';
  saveData();
  renderOrderList();
}

function selectOrder(id){
  if(suppressClick){ return; }
  selectedOrderId = id;
  renderAll();
}

function renderSidebarFooter(){

      '<button class="btn btn-outline btn-sm" style="flex:1" onclick="switchView(\'archive\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="9 18 15 12 9 6"/></svg> 归档' + archiveBadge + '</button>'+
      '</div>';
  }
}

// ==================== MAIN CONTENT ====================
function renderMainContent(){
  var container = document.getElementById('mainContent');

  // No orders → show empty state
  var viewList = (currentView === 'archive') ? archiveOrders : orders;
  if(viewList.length === 0){
    container.innerHTML = '<div class="empty-state" style="display:flex">'+
      '<svg viewBox="0 0 80 80" fill="none"><rect x="15" y="20" width="50" height="45" rx="6" stroke="#9ca3af" stroke-width="2.5"/>'+
      '<line x1="25" y1="32" x2="55" y2="32" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>'+
      '<line x1="25" y1="40" x2="55" y2="40" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>'+
      '<line x1="25" y1="48" x2="40" y2="48" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>'+
      '<circle cx="60" cy="18" r="10" fill="#f472b6" stroke="#fff" stroke-width="2"/>'+
      '<line x1="56" y1="18" x2="64" y2="18" stroke="#fff" stroke-width="2" stroke-linecap="round"/>'+
      '<line x1="60" y1="14" x2="60" y2="22" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>'+
      '<p>还没有订单，点击「新建订单」开始</p></div>';
    return;
  }

  var order = null;
  for(var oi=0; oi<viewList.length; oi++){
    if(viewList[oi].id === selectedOrderId){order=viewList[oi];break;}
  }
  if(!order) order = viewList[0];

  var stageIdx = -1;
  for(var si=0; si<STAGES.length; si++){if(STAGES[si].id===order.currentStage){stageIdx=si;break;}}
  var currentStage = STAGES[stageIdx];
  var colors = STAGE_COLORS[order.currentStage] || {bg:'#f3f4f6',text:'#374151',dot:'#6b7280'};

  var html = '';

  // Header
  html += '<div class="order-detail-header">';
  html += '<div class="order-meta">';
  html += '<span class="order-no-display">' + order.orderNo + '</span>';
  html += '<span class="order-client-display">' + order.client + '</span>';
  if(order.product) html += '<span class="order-product">' + order.product + '</span>';
  if(order.shipDate) html += '<span class="order-ship-meta">船期: ' + order.shipDate + '</span>';
  html += '<span class="stage-badge" style="background:' + colors.bg + ';color:' + colors.text + '">' + currentStage.name + '</span>';
  if(currentView === 'archive') html += '<span style="font-size:11px;color:var(--gray-400)">归档于 ' + (order.archivedAt || '') + '</span>';
  html += '</div>';
  html += '<div style="display:flex;gap:6px">';
  if(currentView === 'archive'){
    html += '<button class="btn btn-success btn-sm" onclick="restoreOrder(\'' + order.id + '\')">恢复订单</button>';
  } else {
    html += '<button class="btn btn-outline btn-sm" onclick="advanceStage(\'' + order.id + '\')"' + (stageIdx >= STAGES.length-1 ? ' disabled' : '') + '>推进到下一节点</button>';
    html += '<button class="btn btn-outline btn-sm" onclick="editOrder(\'' + order.id + '\')">编辑</button>';
    html += '<button class="btn btn-outline btn-sm" onclick="archiveOrder(\'' + order.id + '\')" style="color:#8b5cf6;border-color:#c4b5fe">归档</button>';
    html += '<button class="btn btn-outline btn-sm" onclick="confirmDeleteOrder(\'' + order.id + '\')" style="color:var(--danger);border-color:#fca5a5">删除</button>';
  }
  html += '</div>';
  html += '</div>';


  // Stage timeline
  html += '<div class="stage-timeline">';
  for(var ti=0; ti<STAGES.length; ti++){
    var stage = STAGES[ti];
    var cls = 'stage-step';
    if(ti < stageIdx) cls += ' past';
    else if(ti === stageIdx) cls += ' active';
    else cls += ' future';
    html += '<div class="' + cls + '" id="stage-' + stage.id + '" onclick="jumpToStage(\'' + order.id + '\',\'' + stage.id + '\')">';
    html += '<div style="position:relative;display:inline-block">';
    html += '<div class="stage-step-line"></div>';
    html += '<div class="stage-step-dot">' + (ti < stageIdx ? '&#10003;' : (ti+1)) + '</div>';
    html += '</div>';
    html += '<div class="stage-step-label">' + stage.name + '</div>';
    html += '</div>';
  }
  html += '</div>';

  // Current stage documents
  html += '<div class="section-title">' + currentStage.name + ' — 需要准备的单证</div>';
  html += '<div class="doc-grid">';

  var currentAllDone = true;
  for(var cdi=0; cdi<currentStage.docs.length; cdi++){
    var doc = currentStage.docs[cdi];
    var statusKey = order.currentStage + '_' + doc.key;
    var status = order.docStatus[statusKey] || 'pending';
    if(status !== 'ready' && status !== 'skip') currentAllDone = false;

    var cardClass = 'doc-card';
    if(doc.essential) cardClass += ' essential';
    if(status === 'ready') cardClass += ' ready';
    if(status === 'skip') cardClass += ' skipped';

    var tagHtml = '';
    if(status === 'ready') tagHtml = '<span class="doc-card-tag ready-tag">已准备</span>';
    else if(status === 'pending') tagHtml = '<span class="doc-card-tag pending-tag">待准备</span>';
    else if(status === 'skip') tagHtml = '<span class="doc-card-tag skip-tag">已跳过</span>';

    html += '<div class="' + cardClass + '">';
    html += '<div style="flex:1;min-width:0">';
    html += '<div class="doc-card-name">' + doc.name + (doc.essential ? ' <span style="font-size:10px;color:var(--primary);font-weight:600">[必]</span>' : '') + '</div>';
    html += '</div>';
    html += '<div class="doc-card-actions">';
    html += tagHtml;
    if(status !== 'ready'){
      html += '<button class="btn btn-xs btn-success" onclick="markDoc(\'' + order.id + '\',\'' + order.currentStage + '\',\'' + doc.key + '\',\'ready\')" title="标记已完成">&#10003;</button>';
    }
    if(status !== 'skip'){
      html += '<button class="btn btn-xs btn-outline" onclick="markDoc(\'' + order.id + '\',\'' + order.currentStage + '\',\'' + doc.key + '\',\'skip\')" title="跳过此项">跳过</button>';
    }
    if(status !== 'pending'){
      html += '<button class="btn btn-xs btn-outline" onclick="markDoc(\'' + order.id + '\',\'' + order.currentStage + '\',\'' + doc.key + '\',\'pending\')" title="重置">重置</button>';
    }
    html += '</div></div>';
  }
  html += '</div>';

  if(currentAllDone && stageIdx < STAGES.length - 1){
    html += '<div style="text-align:center;padding:12px;background:var(--success-light);border-radius:var(--radius);margin-bottom:16px;font-size:13px;color:var(--success)">当前节点单证已全部就绪，可以推进到下一节点了！</div>';
  }

  // Previous stages with incomplete docs (overdue)
  for(var pi=0; pi<stageIdx; pi++){
    var prevStage = STAGES[pi];
    var incompleteDocs = [];
    for(var pdi=0; pdi<prevStage.docs.length; pdi++){
      var pdoc = prevStage.docs[pdi];
      var psk = prevStage.id + '_' + pdoc.key;
      var pst = order.docStatus[psk] || 'pending';
      if(pst === 'pending') incompleteDocs.push(pdoc);
    }
    if(incompleteDocs.length > 0){
      html += '<div class="section-title" style="color:var(--danger)">' + prevStage.name + ' — 逾期未完成的单证</div>';
      html += '<div class="doc-grid">';
      for(var idi=0; idi<incompleteDocs.length; idi++){
        var idoc = incompleteDocs[idi];
        html += '<div class="doc-card overdue-doc">';
        html += '<div style="flex:1;min-width:0">';
        html += '<div class="doc-card-name">' + idoc.name + '<span class="overdue-badge">逾期</span>' + (idoc.essential ? ' <span style="font-size:10px;color:var(--danger);font-weight:600">[必]</span>' : '') + '</div>';
        html += '</div>';
        html += '<div class="doc-card-actions">';
        html += '<button class="btn btn-xs btn-success" onclick="markDoc(\'' + order.id + '\',\'' + prevStage.id + '\',\'' + idoc.key + '\',\'ready\')">&#10003; 补完成</button>';
        html += '<button class="btn btn-xs btn-outline" onclick="markDoc(\'' + order.id + '\',\'' + prevStage.id + '\',\'' + idoc.key + '\',\'skip\')">跳过</button>';
        html += '</div></div>';
      }
      html += '</div>';
    }
  }

  // Completed stages summary
  html += '<details style="margin-bottom:16px"><summary style="font-size:13px;font-weight:600;color:var(--gray-600);cursor:pointer;padding:8px 0">已完成的历史节点</summary>';
  html += '<div class="doc-grid">';
  for(var hi=0; hi<stageIdx; hi++){
    var hStage = STAGES[hi];
    for(var hdi=0; hdi<hStage.docs.length; hdi++){
      var hdoc = hStage.docs[hdi];
      var hsk = hStage.id + '_' + hdoc.key;
      var hst = order.docStatus[hsk] || 'pending';
      if(hst === 'ready'){
        html += '<div class="doc-card" style="opacity:.7;border-left-color:var(--success)">';
        html += '<div class="doc-card-name" style="font-size:12px">' + hStage.name + ' · ' + hdoc.name + '</div>';
        html += '<span class="doc-card-tag ready-tag" style="font-size:10px">已完成</span>';
        html += '</div>';
      }
    }
  }
  html += '</div></details>';

  // Notes (collapsible)
  var noteLen = (order.notes && order.notes.trim()) ? order.notes.trim().length : 0;
  html += '<div class="notes-area collapsed" id="notesArea">';
  html += '<div class="notes-header" onclick="toggleNotes(\'' + order.id + '\')">';
  html += '<div class="notes-label"><svg class="notes-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" width="18" height="18"><polyline points="6 9 12 15 18 9" stroke-linecap="round" stroke-linejoin="round"/></svg>备注';
  if(noteLen > 0) html += '<span class="notes-badge">' + noteLen + '字</span>';
  html += '</div></div>';
  html += '<div class="notes-body"><textarea placeholder="添加订单备注...（失焦或收起自动保存）" onblur="saveNote(\'' + order.id + '\',this.value)">' + (order.notes || '') + '</textarea></div>';
  html += '</div>';

  container.innerHTML = html;
}

function markDoc(orderId, stageId, docKey, status){
  var order = null;
  for(var oi=0; oi<orders.length; oi++){if(orders[oi].id===orderId){order=orders[oi];break;}}
  if(!order) return;
  var statusKey = stageId + '_' + docKey;
  order.docStatus[statusKey] = status;
  saveData();
  renderAll();
}

function saveNote(orderId, note){
  var order = null;
  for(var oi=0; oi<orders.length; oi++){if(orders[oi].id===orderId){order=orders[oi];break;}}
  if(!order) return;
  order.notes = note;
  saveData();
}

function toggleNotes(orderId){
  var area = document.getElementById('notesArea');
  if(!area) return;
  // 即将收起（当前是展开态）时，先把 textarea 内容存盘，避免丢失
  if(!area.classList.contains('collapsed')){
    var ta = area.querySelector('textarea');
    if(ta) saveNote(orderId, ta.value);
  }
  area.classList.toggle('collapsed');
}

function advanceStage(orderId){
  var order = null;
  for(var oi=0; oi<orders.length; oi++){if(orders[oi].id===orderId){order=orders[oi];break;}}
  if(!order) return;
  var stageIdx = -1;
  for(var si=0; si<STAGES.length; si++){if(STAGES[si].id===order.currentStage){stageIdx=si;break;}}
  if(stageIdx < 0 || stageIdx >= STAGES.length - 1){
    showToast('已经是最后一个节点');
    return;
  }
  order.currentStage = STAGES[stageIdx+1].id;
  saveData();
  renderAll();
  showToast('已推进到：' + STAGES[stageIdx+1].name);
}

function jumpToStage(orderId, stageId){
  var order = null;
  for(var oi=0; oi<orders.length; oi++){if(orders[oi].id===orderId){order=orders[oi];break;}}
  if(!order) return;
  order.currentStage = stageId;
  saveData();
  renderAll();
  showToast('已切换到：' + (function(){
    for(var si=0; si<STAGES.length; si++){if(STAGES[si].id===stageId) return STAGES[si].name;}
    return stageId;
  })());
}

// ==================== ORDER CRUD ====================
var editingStage = 'confirmation';

function showAddOrderModal(){
  document.getElementById('orderModalTitle').textContent = '新建订单';
  document.getElementById('editOrderId').value = '';
  document.getElementById('inputOrderNo').value = '';
  document.getElementById('inputClient').value = '';
  document.getElementById('inputProduct').value = '';
  document.getElementById('inputETA').value = '';
  editingStage = 'confirmation';
  renderStagePills();
  document.getElementById('orderModal').style.display = 'flex';
}

function editOrder(orderId){
  var order = null;
  for(var oi=0; oi<orders.length; oi++){if(orders[oi].id===orderId){order=orders[oi];break;}}
  if(!order) return;
  document.getElementById('orderModalTitle').textContent = '编辑订单';
  document.getElementById('editOrderId').value = orderId;
  document.getElementById('inputOrderNo').value = order.orderNo;
  document.getElementById('inputClient').value = order.client;
  document.getElementById('inputProduct').value = order.product || '';
  document.getElementById('inputETA').value = order.eta || '';
  document.getElementById('inputShipDate').value = order.shipDate || '';
  editingStage = order.currentStage;
  renderStagePills();
  document.getElementById('orderModal').style.display = 'flex';
}

function renderStagePills(){
  var container = document.getElementById('stagePills');
  var html = '';
  for(var si=0; si<STAGES.length; si++){
    var s = STAGES[si];
    var cls = (s.id === editingStage) ? 'stage-pill selected' : 'stage-pill';
    html += '<span class="' + cls + '" onclick="editingStage=\'' + s.id + '\';renderStagePills()">' + s.name + '</span>';
  }
  container.innerHTML = html;
}

function saveOrder(){
  var id = document.getElementById('editOrderId').value;
  var orderNo = document.getElementById('inputOrderNo').value.trim();
  var client = document.getElementById('inputClient').value.trim();
  var product = document.getElementById('inputProduct').value.trim();
  var eta = document.getElementById('inputETA').value;
  var shipDate = document.getElementById('inputShipDate').value;

  if(!orderNo || !client){showToast('订单号和客户名称为必填');return;}

  if(id){
    var order = null;
    for(var oi=0; oi<orders.length; oi++){if(orders[oi].id===id){order=orders[oi];break;}}
    if(!order) return;
    order.orderNo = orderNo;
    order.client = client;
    order.product = product;
    order.eta = eta;
    order.shipDate = shipDate;
    order.currentStage = editingStage;
    // Ensure all stage docs have entries
    for(var si=0; si<STAGES.length; si++){
      var s = STAGES[si];
      for(var di=0; di<s.docs.length; di++){
        var sk = s.id + '_' + s.docs[di].key;
        if(!(sk in order.docStatus)) order.docStatus[sk] = 'pending';
      }
    }
  }else{
    var docStatus = {};
    for(var si2=0; si2<STAGES.length; si2++){
      var s2 = STAGES[si2];
      for(var di2=0; di2<s2.docs.length; di2++){
        docStatus[s2.id + '_' + s2.docs[di2].key] = 'pending';
      }
    }
    var newOrder = {
      id: 'o' + Date.now(),
      orderNo: orderNo,
      client: client,
      product: product,
      currentStage: editingStage,
      eta: eta,
      shipDate: shipDate,
      docStatus: docStatus,
      notes: '',
      createdAt: dateStr(Date.now())
    };
    orders.push(newOrder);
    selectedOrderId = newOrder.id;
  }

  saveData();
  closeModal('orderModal');
  renderAll();
  showToast('订单已保存');
}

function confirmDeleteOrder(orderId){
  var list = (currentView === 'archive') ? archiveOrders : orders;
  var order = null;
  for(var oi=0; oi<list.length; oi++){if(list[oi].id===orderId){order=list[oi];break;}}
  if(!order) return;
  document.getElementById('confirmMsg').textContent = '确认删除订单 ' + order.orderNo + '？此操作不可恢复。';
  document.getElementById('confirmOkBtn').onclick = function(){
    deleteOrder(orderId);closeConfirm();
  };
  document.getElementById('confirmDialog').style.display = 'flex';
}

function deleteOrder(orderId){
  var list = (currentView === 'archive') ? archiveOrders : orders;
  var newList = [];
  for(var oi=0; oi<list.length; oi++){
    if(list[oi].id !== orderId) newList.push(list[oi]);
  }
  if(currentView === 'archive'){ archiveOrders = newList; }
  else { orders = newList; }
  if(selectedOrderId === orderId){
    var targetList = (currentView === 'archive') ? archiveOrders : orders;
    selectedOrderId = targetList.length > 0 ? targetList[0].id : null;
  }
  saveData();
  renderAll();
  showToast('订单已删除');
}

function archiveOrder(orderId){
  var target = null, targetIdx = -1;
  for(var oi=0; oi<orders.length; oi++){if(orders[oi].id===orderId){target=orders[oi];targetIdx=oi;break;}}
  if(!target) return;
  target.archivedAt = dateStr(Date.now());
  archiveOrders.push(target);
  orders.splice(targetIdx,1);
  if(selectedOrderId === orderId){ selectedOrderId = orders.length > 0 ? orders[0].id : null; }
  saveData();
  renderAll();
  showToast(target.orderNo + ' 已归档');
}

function restoreOrder(orderId){
  var target = null, targetIdx = -1;
  for(var oi=0; oi<archiveOrders.length; oi++){if(archiveOrders[oi].id===orderId){target=archiveOrders[oi];targetIdx=oi;break;}}
  if(!target) return;
  delete target.archivedAt;
  orders.push(target);
  archiveOrders.splice(targetIdx,1);
  selectedOrderId = target.id;
  switchView('active');
  saveData();
  renderAll();
  showToast(target.orderNo + ' 已恢复');
}

function switchView(view){
  currentView = view;
  if(view === 'active'){ selectedOrderId = orders.length > 0 ? orders[0].id : null; }
  else { selectedOrderId = archiveOrders.length > 0 ? archiveOrders[0].id : null; }
  renderAll();
}

function closeConfirm(){
  document.getElementById('confirmDialog').style.display = 'none';
}

// ==================== MODAL ====================
function closeModal(id){
  document.getElementById(id).style.display = 'none';
}

// ==================== EXPORT / IMPORT ====================
function exportJSON(){
  try{
    var exportData = { orders: orders, archiveOrders: archiveOrders };
    var data = JSON.stringify(exportData, null, 2);
    var blob = new Blob([data], { type:'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'waimao-orders-backup-' + dateStr(Date.now()) + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
    showToast('数据已导出（含 ' + orders.length + ' 活跃 + ' + archiveOrders.length + ' 归档）');
  }catch(e){
    showToast('导出失败');
  }
}

function importJSON(event){
  var file = event.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var raw = JSON.parse(e.target.result);
      var importOrders = [], importArchive = [];
      if(Array.isArray(raw)){
        // Backward compatible: flat array
        importOrders = raw;
      }else{
        importOrders = raw.orders || [];
        importArchive = raw.archiveOrders || [];
      }
      document.getElementById('confirmMsg').textContent = '即将导入 ' + importOrders.length + ' 条活跃订单 + ' + importArchive.length + ' 条归档订单。将覆盖当前数据。确认导入？';
      document.getElementById('confirmOkBtn').onclick = function(){
        orders = importOrders;
        archiveOrders = importArchive;
        currentView = 'active';
        selectedOrderId = orders.length > 0 ? orders[0].id : (archiveOrders.length > 0 ? null : null);
        saveData();
        renderAll();
        closeConfirm();
        showToast('成功导入 ' + orders.length + ' + ' + archiveOrders.length + ' 条订单');
      };
      document.getElementById('confirmDialog').style.display = 'flex';
    }catch(err){
      showToast('导入失败：文件格式不正确');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function clearExamples(){
  var hasExample = false;
  for(var oi=0; oi<orders.length; oi++){if(orders[oi].id.indexOf('ex')===0){hasExample=true;break;}}
  if(!hasExample){showToast('没有示例数据需要清除');return;}
  document.getElementById('confirmMsg').textContent = '确认清除所有示例数据？已有的非示例订单会保留。';
  document.getElementById('confirmOkBtn').onclick = function(){
    var newOrders = [];
    for(var oi2=0; oi2<orders.length; oi2++){
      if(orders[oi2].id.indexOf('ex')!==0) newOrders.push(orders[oi2]);
    }
    orders = newOrders;
    selectedOrderId = orders.length > 0 ? orders[0].id : null;
    saveData();
    renderAll();
    closeConfirm();
    showToast('示例数据已清除');
  };
  document.getElementById('confirmDialog').style.display = 'flex';
}

// ==================== TOAST ====================
var toastTimer = null;
function showToast(msg){
  var toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.style.display = 'block';
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){toast.style.display = 'none';}, 2500);
}

// ==================== 看板（集成 Tab） ====================
var HEALTH_COLORS = {overdue:'#fb7185',pending:'#fbbf24',normal:'#34d399',done:'#a78bfa'};
var HEALTH_NAMES = {overdue:'逾期',pending:'待处理',normal:'正常推进',done:'已完成'};
var STAGE_PIE_COLORS = {
  confirmation:'#f9a8d4',production:'#f472b6',data_check:'#c084fc',booking:'#f0abfc',
  customs:'#5eead4',client_docs:'#60a5fa',presentation:'#fcd34d',payment:'#fb923c'
};
var CHART_SIZE = 180; // 两个图统一尺寸，保证高度一致
var currentSel = null; // {type:'health'|'stage', key:string}
var currentTab = 'workbench';

// ---- 健康度计算（依赖全局 STAGES / orders）----
function getStageIdx(id){for(var i=0;i<STAGES.length;i++){if(STAGES[i].id===id)return i;}return -1;}
function isOverdue(order){
  var si=getStageIdx(order.currentStage);if(si<0)return false;
  for(var p=0;p<si;p++){var ps=STAGES[p];for(var d=0;d<ps.docs.length;d++){var k=ps.id+'_'+ps.docs[d].key;if((order.docStatus[k]||'pending')==='pending')return true;}}
  return false;
}
function currentPending(order){
  var si=getStageIdx(order.currentStage);if(si<0)return 0;var c=0,cs=STAGES[si];
  for(var d=0;d<cs.docs.length;d++){var k=cs.id+'_'+cs.docs[d].key;if((order.docStatus[k]||'pending')==='pending')c++;}
  return c;
}
function isComplete(order){
  var si=getStageIdx(order.currentStage);
  if(si!==STAGES.length-1)return false;
  return currentPending(order)===0;
}
function healthBucket(order){
  if(isOverdue(order))return 'overdue';
  if(isComplete(order))return 'done';
  if(currentPending(order)>0)return 'pending';
  return 'normal';
}

// ---- 甜甜圈 SVG ----
function polar(cx,cy,r,deg){var a=(deg-90)*Math.PI/180;return {x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)};}
function donutArc(cx,cy,rO,rI,start,end){
  var so=polar(cx,cy,rO,end),eo=polar(cx,cy,rO,start),si=polar(cx,cy,rI,start),ei=polar(cx,cy,rI,end);
  var large=(end-start)<=180?0:1;
  return 'M'+so.x.toFixed(2)+' '+so.y.toFixed(2)+' A'+rO+' '+rO+' 0 '+large+' 0 '+eo.x.toFixed(2)+' '+eo.y.toFixed(2)+' L'+si.x.toFixed(2)+' '+si.y.toFixed(2)+' A'+rI+' '+rI+' 0 '+large+' 1 '+ei.x.toFixed(2)+' '+ei.y.toFixed(2)+' Z';
}
function donutSVG(segs,size,selectedKey){
  var cx=size/2,cy=size/2,rO=size/2-6,rI=rO*0.60,rMid=(rO+rI)/2;
  var total=0;for(var i=0;i<segs.length;i++)total+=segs[i].value;
  var svg='<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">';
  svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+rMid+'" fill="none" stroke="#fce7f3" stroke-width="'+(rO-rI)+'"/>';
  if(total>0){
    var ang=0;
    for(var j=0;j<segs.length;j++){
      var seg=segs[j];if(seg.value<=0)continue;
      var frac=seg.value/total,sweep=frac*360;
      var isSel=(selectedKey!==null&&seg.key===selectedKey);
      var cls=isSel?'slice sel':'slice';
      var title=seg.label+'：'+seg.value;
      if(frac>=0.999){
        svg+='<circle class="'+cls+'" cx="'+cx+'" cy="'+cy+'" r="'+rMid+'" fill="none" stroke="'+seg.color+'" stroke-width="'+(rO-rI)+'" onclick="selectCategory(\''+seg.type+'\',\''+seg.key+'\')"><title>'+title+'</title></circle>';
      }else{
        var path=donutArc(cx,cy,rO,rI,ang,ang+sweep);
        svg+='<path class="'+cls+'" d="'+path+'" fill="'+seg.color+'" stroke="#fff" stroke-width="2.5" onclick="selectCategory(\''+seg.type+'\',\''+seg.key+'\')"><title>'+title+'</title></path>';
      }
      ang+=sweep;
    }
  }
  svg+='</svg>';
  return svg;
}
function legendHTML(segs,type,selectedKey){
  var html='';
  for(var i=0;i<segs.length;i++){
    var s=segs[i];
    var active=(selectedKey!==null&&s.key===selectedKey)?' active':'';
    var zeroCls=s.value===0?' zero':'';
    html+='<div class="legend-item'+active+'" onclick="selectCategory(\''+type+'\',\''+s.key+'\')"><span class="sw" style="background:'+s.color+'"></span><span class="nm'+zeroCls+'">'+s.label+'</span><span class="val">'+s.value+'</span></div>';
  }
  return html;
}

// ---- 渲染看板（直接读全局 orders，与主工作台同源，天然同步）----
function renderDashboard(){
  var total=orders.length;
  var buckets={overdue:0,pending:0,normal:0,done:0};
  for(var b=0;b<orders.length;b++){buckets[healthBucket(orders[b])]++;}
  var healthSegs=[
    {type:'health',key:'overdue',label:'逾期',value:buckets.overdue,color:HEALTH_COLORS.overdue},
    {type:'health',key:'pending',label:'待处理',value:buckets.pending,color:HEALTH_COLORS.pending},
    {type:'health',key:'normal',label:'正常推进',value:buckets.normal,color:HEALTH_COLORS.normal},
    {type:'health',key:'done',label:'已完成',value:buckets.done,color:HEALTH_COLORS.done}
  ];
  var selHealth=(currentSel&&currentSel.type==='health')?currentSel.key:null;
  document.getElementById('healthBox').innerHTML=donutSVG(healthSegs,CHART_SIZE,selHealth)+'<div class="pie-center"><div class="big">'+total+'</div><div class="small">总订单</div></div>';
  document.getElementById('healthLegend').innerHTML=legendHTML(healthSegs,'health',selHealth);
  var stageCounts={};for(var sc=0;sc<STAGES.length;sc++)stageCounts[STAGES[sc].id]=0;
  for(var so=0;so<orders.length;so++){if(stageCounts[orders[so].currentStage]!==undefined)stageCounts[orders[so].currentStage]++;}
  var stageSegs=[];
  for(var i=0;i<STAGES.length;i++){stageSegs.push({type:'stage',key:STAGES[i].id,label:STAGES[i].name,value:stageCounts[STAGES[i].id],color:STAGE_PIE_COLORS[STAGES[i].id]});}
  var selStage=(currentSel&&currentSel.type==='stage')?currentSel.key:null;
  document.getElementById('stageBox').innerHTML=donutSVG(stageSegs,CHART_SIZE,selStage)+'<div class="pie-center"><div class="big">'+total+'</div><div class="small">总订单</div></div>';
  document.getElementById('stageLegend').innerHTML=legendHTML(stageSegs,'stage',selStage);
  var now=new Date();
  var lu=document.getElementById('lastUpdate');
  if(lu)lu.textContent='更新于 '+now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0')+':'+now.getSeconds().toString().padStart(2,'0');
}

function selectCategory(type,key){
  currentSel={type:type,key:key};
  renderDashboard();
  renderDrill();
  var db=document.getElementById('drillBody');
  if(db)db.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function closeDrill(){
  currentSel=null;
  renderDashboard();
  defaultDrill();
}
function defaultDrill(){
  document.getElementById('drillTitle').innerHTML='订单明细';
  document.getElementById('drillBody').innerHTML='<div class="empty-state"><svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#f9a8d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/><path d="M11 8v6M8 11h6"/></svg>点击上方甜甜圈中的任意色块，查看该分类下的全部订单明细</div>';
}
function renderDrill(){
  var title='',list=[];
  if(currentSel.type==='health'){
    title=HEALTH_NAMES[currentSel.key];
    for(var i=0;i<orders.length;i++){if(healthBucket(orders[i])===currentSel.key)list.push(orders[i]);}
  }else{
    var st=null;
    for(var s=0;s<STAGES.length;s++){if(STAGES[s].id===currentSel.key){st=STAGES[s];break;}}
    title=st?st.name:'';
    for(var j=0;j<orders.length;j++){if(orders[j].currentStage===currentSel.key)list.push(orders[j]);}
  }
  if(currentSel.type==='health'){
    list.sort(function(a,b){var ra=healthBucket(a)==='overdue'?0:1,rb=healthBucket(b)==='overdue'?0:1;return ra-rb;});
  }
  document.getElementById('drillTitle').innerHTML=title+' <span class="cnt">'+list.length+'</span>';
  if(list.length===0){
    document.getElementById('drillBody').innerHTML='<div class="empty-state"><svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#f9a8d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 12h6"/></svg>该分类下暂无订单</div>';
    return;
  }
  var html='<div class="drill-list">';
  for(var k=0;k<list.length;k++){html+=orderRow(list[k]);}
  html+='</div>';
  document.getElementById('drillBody').innerHTML=html;
}
function orderRow(o){
  var si=getStageIdx(o.currentStage);
  var stName=si>=0?STAGES[si].name:o.currentStage;
  var col=STAGE_COLORS[o.currentStage]||{bg:'#fdf2f8',text:'#be185d'};
  var hb=healthBucket(o);
  var hbMap={overdue:['逾期','#fb7185'],pending:['待处理','#fbbf24'],normal:['正常','#34d399'],done:['已完成','#a78bfa']};
  var ht=hbMap[hb]||['','#999'];
  var prod=o.product?('<div class="drill-product">'+o.product+'</div>'):'';
  return '<div class="drill-row"><a class="drill-no" href="javascript:void(0)" onclick="gotoWorkbenchOrder(\''+o.id+'\')"><span class="dot"></span>'+o.orderNo+'</a><div class="drill-info"><div class="drill-client">'+o.client+'</div>'+prod+'</div><span class="drill-badge" style="background:'+col.bg+';color:'+col.text+'">'+stName+'</span><span class="drill-htag" style="background:'+ht[1]+'">'+ht[0]+'</span></div>';
}

// ---- Tab 切换：切到看板时实时重渲染，保证与主工作台数据同步 ----
function switchTab(tab){
  currentTab=tab;
  document.getElementById('tab-workbench').classList.toggle('active',tab==='workbench');
  document.getElementById('tab-dashboard').classList.toggle('active',tab==='dashboard');
  var wb=document.getElementById('layout');
  var db=document.getElementById('dashboardView');
  if(tab==='workbench'){
    wb.style.display='flex';
    db.style.display='none';
    renderAll();
    var ms=document.getElementById('mainContent'); if(ms) ms.scrollTop=0;
  }else{
    wb.style.display='none';
    db.style.display='block';
    renderDashboard();
    db.scrollTop=0;
  }
}
function gotoWorkbenchOrder(id){
  switchTab('workbench');
  currentView='active';
  selectedOrderId=id;
  renderAll();
  var ms=document.getElementById('mainContent');
  if(ms)ms.scrollIntoView({behavior:'smooth',block:'start'});
}

// ==================== STARTUP ====================
(function(){
  if(location.protocol === 'file:'){
    // 本地预览：无服务器，跳过登录遮罩直接进页面
    document.getElementById('loginOverlay').classList.add('hidden');
    window._appInited = true;
    init();
    initOrderDrag();
    return;
  }
  fetch('/api/me').then(function(r){
    if(r.ok){
      document.getElementById('loginOverlay').classList.add('hidden');
      window._appInited = true;
      init();
      initOrderDrag();
    }
  }).catch(function(){
    // server unreachable / not authed -> show login overlay (default visible)
  });
})();
</script>
