<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>外贸跟单工作台</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC",sans-serif;
  background:linear-gradient(135deg,#fdf2f8 0%,#fff5f9 30%,#fef8fb 60%,#fff 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;
}
.login-card{
  background:#fff;border-radius:20px;padding:40px 36px;width:360px;max-width:92vw;
  box-shadow:0 8px 30px rgba(244,114,182,.15),0 2px 8px rgba(0,0,0,.05);
  text-align:center;
}
.login-logo{
  width:56px;height:56px;margin:0 auto 16px;
}
.login-title{
  font-size:22px;font-weight:700;color:#383336;margin-bottom:4px;
}
.login-sub{
  font-size:13px;color:#9d8d95;margin-bottom:28px;
}
.login-input{
  width:100%;padding:12px 16px;border:2px solid #fbcfe8;border-radius:14px;
  font-size:16px;font-family:inherit;color:#383336;outline:none;
  transition:border-color .25s ease,box-shadow .25s ease;
}
.login-input:focus{
  border-color:#f472b6;box-shadow:0 0 0 4px rgba(244,114,182,.15);
}
.login-btn{
  width:100%;padding:12px;margin-top:16px;background:#f472b6;color:#fff;
  border:none;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;
  transition:all .25s ease;
}
.login-btn:hover{background:#ec4899;box-shadow:0 4px 14px rgba(244,114,182,.3)}
.login-btn:disabled{opacity:.5;cursor:not-allowed}
.login-error{
  margin-top:12px;font-size:13px;color:#f87171;min-height:20px;
}
.login-footer{
  margin-top:24px;font-size:11px;color:#c4b5bd;
}
.login-shake{
  animation:shake .4s ease;
}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-6px)}
  40%{transform:translateX(6px)}
  60%{transform:translateX(-4px)}
  80%{transform:translateX(4px)}
}
</style>
</head>
<body>
<div class="login-card" id="loginCard">
  <!-- Logo SVG -->
  <div class="login-logo">
    <svg viewBox="0 0 56 56" fill="none">
      <rect x="4" y="10" width="48" height="40" rx="10" fill="#fdf2f8" stroke="#f472b6" stroke-width="2.5"/>
      <line x1="14" y1="22" x2="42" y2="22" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="14" y1="30" x2="42" y2="30" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="14" y1="38" x2="30" y2="38" stroke="#f9a8d4" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="42" cy="10" r="6" fill="#f472b6"/>
      <line x1="39" y1="10" x2="45" y2="10" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <line x1="42" y1="7" x2="42" y2="13" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="login-title">外贸跟单工作台</div>
  <div class="login-sub">请输入密码以继续</div>
  <input type="password" class="login-input" id="passwordInput" placeholder="输入密码" autofocus onkeydown="if(event.key==='Enter')doLogin()">
  <button class="login-btn" id="loginBtn" onclick="doLogin()">进入工作台</button>
  <div class="login-error" id="loginError"></div>
  <div class="login-footer">数据加密存储 &middot; 仅限授权访问</div>
</div>

<script>
function doLogin(){
  var input = document.getElementById('passwordInput');
  var btn = document.getElementById('loginBtn');
  var card = document.getElementById('loginCard');
  var error = document.getElementById('loginError');
  var pwd = input.value.trim();

  if(!pwd){
    error.textContent = '请输入密码';
    card.classList.add('login-shake');
    setTimeout(function(){ card.classList.remove('login-shake'); }, 400);
    return;
  }

  btn.disabled = true;
  btn.textContent = '验证中...';
  error.textContent = '';

  var xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/login', true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.onload = function(){
    btn.disabled = false;
    btn.textContent = '进入工作台';
    if(xhr.status === 200){
      var resp = JSON.parse(xhr.responseText);
      if(resp.success){
        window.location.href = '/';
      }else{
        error.textContent = '密码错误，请重试';
        card.classList.add('login-shake');
        setTimeout(function(){ card.classList.remove('login-shake'); }, 400);
      }
    }else{
      error.textContent = '密码错误，请重试';
      card.classList.add('login-shake');
      setTimeout(function(){ card.classList.remove('login-shake'); }, 400);
    }
  };
  xhr.onerror = function(){
    btn.disabled = false;
    btn.textContent = '进入工作台';
    error.textContent = '网络错误，请重试';
  };
  xhr.send(JSON.stringify({ password: pwd }));
}
</script>
</body>
</html>
